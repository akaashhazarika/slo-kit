[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slo-kit"
version = "1.0.0"
description = "Define SLOs as code and get correct multi-window burn-rate Prometheus alerts for free."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "slo-kit contributors" }]
keywords = [
    "slo",
    "sli",
    "sre",
    "error-budget",
    "burn-rate",
    "prometheus",
    "observability",
    "reliability",
    "alerting",
    "opentelemetry",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/slo-kit/slo-kit"
Documentation = "https://slo-kit.github.io/slo-kit/"
Repository = "https://github.com/slo-kit/slo-kit"
Changelog = "https://github.com/slo-kit/slo-kit/blob/main/CHANGELOG.md"
Issues = "https://github.com/slo-kit/slo-kit/issues"

[project.scripts]
slo-kit = "slo_kit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/slo_kit"]

[tool.hatch.build.targets.sdist]
include = ["src/slo_kit", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/slo_kit"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["slo_kit"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
